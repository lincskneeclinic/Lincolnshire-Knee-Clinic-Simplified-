<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <radialGradient id="painGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5733" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FF5733" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5733" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="600" fill="#F8FAFC"/>
  <g stroke="#E2E8F0" stroke-width="0.5">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500"/>
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600"/>
  </g>

  <!-- Knee Bones Silhouette (Lateral profile) -->
  <!-- Femur -->
  <path d="M 400,50 L 400,250 C 400,280 370,290 350,330 C 340,350 370,360 390,360 C 420,360 450,330 450,290 C 450,250 440,250 440,50 Z" fill="url(#boneGrad)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Tibia -->
  <path d="M 370,550 L 370,410 C 370,390 350,390 350,380 C 350,370 450,370 450,380 C 450,390 430,390 430,410 L 430,550 Z" fill="url(#boneGrad)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Fibula (Prominent on Lateral View) -->
  <path d="M 340,550 L 340,410 C 340,400 350,400 355,410 L 355,550 Z" fill="url(#boneGrad)" stroke="#94A3B8" stroke-width="2"/>

  <!-- Patella (Lateral edge) -->
  <path d="M 480,290 C 490,290 495,305 495,320 C 495,335 490,350 480,350 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" opacity="0.8"/>

  <!-- Lateral Collateral Ligament (LCL) -->
  <path d="M 385,320 L 350,405" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Iliotibial Band (ITB) overlay -->
  <path d="M 410,50 L 380,360 L 355,400" stroke="#008080" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Pain Highlight Area (Glow) -->
  <circle cx="360" cy="360" r="100" fill="url(#painGlow)"/>

  <!-- Annotation Pins -->
  <circle cx="360" cy="360" r="15" fill="#FF5733" stroke="#FFFFFF" stroke-width="2"/>
  <text x="360" y="364" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L</text>

  <!-- Title/Label inside the visual -->
  <rect x="50" y="50" width="220" height="70" rx="6" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
  <text x="65" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">Lateral Joint Line</text>
  <text x="65" y="95" font-family="sans-serif" font-size="10" fill="#94A3B8">ITB and LCL Pain Zone</text>
</svg>
