<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lincolnshire Knee Clinic — Focal Articular Cartilage Defect Schematic
  ======================================================================
  Educational schematic showing a localized ("chondral") cartilage defect
  on the femoral condyle, exposing the bone beneath.

  CLINICAL REVIEW STATUS: Awaiting clinical review
  Do NOT use this as a clinical reference until reviewed.

  Attribution: Internal — Lincolnshire Knee Clinic
  Licence: All rights reserved — Lincolnshire Knee Clinic
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  role="img"
  aria-labelledby="ci-title"
  aria-describedby="ci-desc"
  focusable="false"
  style="font-family: sans-serif; background-color: #071324;"
>
  <title id="ci-title">Schematic cross-section of a focal articular cartilage defect on the femoral condyle</title>
  <desc id="ci-desc">
    An educational schematic showing the end of the thigh bone (femoral condyle) with a normal, smooth cartilage surface on one side, and a localized "pothole"-like cartilage defect exposing the underlying bone on the other.
  </desc>

  <rect width="800" height="600" fill="#071324" rx="16"/>

  <defs>
    <pattern id="ci-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#ci-grid)" rx="16" aria-hidden="true"/>

  <!-- Femoral condyle (bone) -->
  <g data-region="femoral-condyle" aria-label="Femoral condyle">
    <path d="M 180 480 C 150 380, 160 260, 260 200 C 400 130, 560 150, 610 260 C 650 350, 630 440, 560 490 C 460 545, 260 545, 180 480 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
  </g>

  <!-- Healthy cartilage cap (left side) -->
  <g data-region="healthy-cartilage" aria-label="Healthy articular cartilage">
    <path d="M 195 300 C 200 240, 260 200, 330 210 C 340 250, 335 300, 325 340 C 270 350, 220 335, 195 300 Z"
          fill="rgba(0,175,200,0.25)" stroke="rgba(0,175,200,0.85)" stroke-width="2.5"/>
  </g>

  <!-- Focal chondral defect (right side, exposing bone) -->
  <g data-region="chondral-defect" aria-label="Focal chondral defect exposing subchondral bone">
    <path d="M 420 220 C 470 205, 540 220, 570 260 C 585 285, 575 315, 545 325 C 495 340, 440 320, 415 285 C 405 265, 405 235, 420 220 Z"
          fill="rgba(148,113,72,0.55)" stroke="#F97316" stroke-width="3"/>
    <path d="M 445 250 C 460 245, 490 248, 505 262" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.7"/>
    <path d="M 450 275 C 470 280, 495 278, 515 268" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Cartilage transition zone (fraying edge) -->
  <g data-region="frayed-edge" aria-label="Frayed cartilage edge at defect margin">
    <path d="M 330 215 C 365 205, 400 210, 420 225" fill="none" stroke="#fdba74" stroke-width="3" stroke-dasharray="4,3"/>
  </g>

  <!-- Labels -->
  <line x1="130" y1="180" x2="255" y2="240" stroke="#00AFC8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="125" y="183" text-anchor="end" fill="#a5f3fc" font-size="15" font-weight="bold">Healthy Articular Cartilage</text>

  <line x1="660" y1="200" x2="555" y2="255" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2" opacity="0.8"/>
  <text x="665" y="203" fill="#fdba74" font-size="15" font-weight="bold">Chondral Defect ("Pothole")</text>

  <line x1="660" y1="380" x2="590" y2="460" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="665" y="383" fill="#cbd5e1" font-size="15" font-weight="bold">Exposed Subchondral Bone</text>

  <line x1="130" y1="480" x2="290" y2="460" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="125" y="483" text-anchor="end" fill="#cbd5e1" font-size="15" font-weight="bold">Femoral Condyle (Bone)</text>

  <!-- Watermark banner -->
  <rect x="0" y="555" width="800" height="45" fill="#1e293b" rx="0"/>
  <rect x="0" y="555" width="6" height="45" fill="#f97316"/>
  <text x="20" y="575" font-size="14" font-weight="bold" fill="#fdba74">EDUCATIONAL ILLUSTRATION — AWAITING CLINICAL REVIEW</text>
  <text x="20" y="592" font-size="12" fill="#cbd5e1">Not a clinical reference. Not for diagnosis. All rights reserved — Lincolnshire Knee Clinic.</text>
</svg>
