<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lincolnshire Knee Clinic — Patellar Instability Schematic (Anterior View)
  ============================================================================
  Educational schematic showing lateral dislocation of the kneecap out of the
  trochlear groove, with rupture of the medial patellofemoral ligament (MPFL).

  CLINICAL REVIEW STATUS: Awaiting clinical review
  Do NOT use this as a clinical reference until reviewed.

  Attribution: Internal — Lincolnshire Knee Clinic
  Licence: All rights reserved — Lincolnshire Knee Clinic
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  role="img"
  aria-labelledby="pis-title"
  aria-describedby="pis-desc"
  focusable="false"
  style="font-family: sans-serif; background-color: #071324;"
>
  <title id="pis-title">Schematic anterior view of the knee showing lateral patellar instability</title>
  <desc id="pis-desc">
    An educational schematic of the front of the knee, showing the kneecap (patella) displaced laterally outside the trochlear groove, with a torn medial patellofemoral ligament (MPFL) shown on the inner side.
  </desc>

  <rect width="800" height="600" fill="#071324" rx="16"/>

  <defs>
    <pattern id="pis-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#pis-grid)" rx="16" aria-hidden="true"/>

  <!-- Femur -->
  <g data-region="femur" aria-label="Femur">
    <path d="M 320 40 L 480 40 L 480 230 C 460 250, 430 258, 400 258 C 370 258, 340 250, 320 230 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
  </g>

  <!-- Trochlear groove -->
  <g data-region="trochlear-groove" aria-label="Trochlear groove (empty, patella displaced)">
    <path d="M 355 250 C 375 262, 425 262, 445 250 C 445 280, 425 300, 400 300 C 375 300, 355 280, 355 250 Z"
          fill="rgba(0,175,200,0.10)" stroke="rgba(0,175,200,0.45)" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Torn MPFL (medial side) -->
  <g data-region="mpfl-torn" aria-label="Torn medial patellofemoral ligament (MPFL)">
    <path d="M 340 250 C 335 265, 340 280, 355 290" fill="none" stroke="#fdba74" stroke-width="4" stroke-dasharray="3,4" stroke-linecap="round"/>
    <path d="M 320 275 C 328 280, 335 290, 340 300" fill="none" stroke="#fdba74" stroke-width="3" stroke-dasharray="3,4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Patella, dislocated laterally -->
  <g data-region="patella-dislocated" aria-label="Patella dislocated laterally">
    <ellipse cx="520" cy="320" rx="55" ry="65" fill="rgba(255,255,255,0.14)" stroke="rgba(226,232,240,0.85)" stroke-width="2.5"/>
  </g>

  <!-- Displacement arrow -->
  <g data-region="displacement-arrow" aria-label="Direction of lateral displacement">
    <path d="M 405 285 C 445 295, 475 305, 495 315" fill="none" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 483 305 L 500 317 L 480 325 Z" fill="#F97316"/>
  </g>

  <!-- Tibia -->
  <g data-region="tibia" aria-label="Tibia">
    <path d="M 350 400 C 365 393, 435 393, 450 400 L 460 570 L 340 570 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
  </g>

  <!-- Labels -->
  <line x1="600" y1="120" x2="470" y2="150" stroke="#00AFC8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="605" y="123" fill="#a5f3fc" font-size="15" font-weight="bold">Femur (Thigh Bone)</text>

  <line x1="150" y1="270" x2="330" y2="270" stroke="#fdba74" stroke-width="1" stroke-dasharray="2,2" opacity="0.8"/>
  <text x="145" y="273" text-anchor="end" fill="#fdba74" font-size="15" font-weight="bold">Torn MPFL (Medial Ligament)</text>

  <line x1="150" y1="330" x2="352" y2="270" stroke="#00AFC8" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="145" y="333" text-anchor="end" fill="#a5f3fc" font-size="15" font-weight="bold">Empty Trochlear Groove</text>

  <line x1="660" y1="240" x2="555" y2="290" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="665" y="243" fill="#e2e8f0" font-size="15" font-weight="bold">Patella — Dislocated Laterally</text>

  <!-- Watermark banner -->
  <rect x="0" y="555" width="800" height="45" fill="#1e293b" rx="0"/>
  <rect x="0" y="555" width="6" height="45" fill="#f97316"/>
  <text x="20" y="575" font-size="14" font-weight="bold" fill="#fdba74">EDUCATIONAL ILLUSTRATION — AWAITING CLINICAL REVIEW</text>
  <text x="20" y="592" font-size="12" fill="#cbd5e1">Not a clinical reference. Not for diagnosis. All rights reserved — Lincolnshire Knee Clinic.</text>
</svg>
