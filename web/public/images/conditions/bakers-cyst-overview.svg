<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lincolnshire Knee Clinic — Baker's Cyst Schematic (Posterior View)
  ====================================================================
  Educational schematic showing a fluid-filled popliteal (Baker's) cyst
  emerging from the back of the knee joint.

  CLINICAL REVIEW STATUS: Awaiting clinical review
  Do NOT use this as a clinical reference until reviewed.

  Attribution: Internal — Lincolnshire Knee Clinic
  Licence: All rights reserved — Lincolnshire Knee Clinic
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  role="img"
  aria-labelledby="bc-title"
  aria-describedby="bc-desc"
  focusable="false"
  style="font-family: sans-serif; background-color: #071324;"
>
  <title id="bc-title">Schematic posterior view of the knee showing a Baker's cyst in the popliteal space</title>
  <desc id="bc-desc">
    An educational schematic of the back of the knee joint, showing a fluid-filled swelling (Baker's cyst) bulging out from the popliteal fossa, connected to the joint capsule by a narrow neck.
  </desc>

  <rect width="800" height="600" fill="#071324" rx="16"/>

  <defs>
    <pattern id="bc-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bc-grid)" rx="16" aria-hidden="true"/>

  <!-- Femur (posterior) -->
  <g data-region="femur" aria-label="Femur, posterior view">
    <path d="M 320 40 L 480 40 L 480 220 C 460 240, 430 245, 400 245 C 370 245, 340 240, 320 220 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
  </g>

  <!-- Femoral condyles -->
  <g data-region="femoral-condyles" aria-label="Femoral condyles">
    <path d="M 300 230 C 280 250, 275 290, 295 320 C 315 345, 355 350, 375 330 L 375 250 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
    <path d="M 500 230 C 520 250, 525 290, 505 320 C 485 345, 445 350, 425 330 L 425 250 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
  </g>

  <!-- Tibia -->
  <g data-region="tibia" aria-label="Tibia">
    <path d="M 335 355 C 350 348, 450 348, 465 355 L 465 560 L 410 560 L 405 400 L 395 400 L 390 560 L 335 560 Z"
          fill="rgba(255,255,255,0.10)" stroke="rgba(148,163,184,0.65)" stroke-width="2.5"/>
  </g>

  <!-- Popliteal fossa outline -->
  <g data-region="popliteal-fossa" aria-label="Popliteal fossa (space behind the knee)">
    <path d="M 375 260 C 390 275, 410 275, 425 260 L 425 340 C 410 355, 390 355, 375 340 Z"
          fill="rgba(0,175,200,0.10)" stroke="rgba(0,175,200,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Baker's cyst -->
  <g data-region="bakers-cyst" aria-label="Baker's cyst, fluid-filled swelling">
    <path d="M 400 300 C 410 290, 430 288, 440 300 C 470 320, 500 360, 495 410 C 490 460, 440 480, 405 460 C 375 442, 365 400, 375 360 C 380 335, 390 310, 400 300 Z"
          fill="rgba(249,115,22,0.22)" stroke="#F97316" stroke-width="3"/>
    <ellipse cx="435" cy="380" rx="10" ry="14" fill="rgba(253,230,138,0.5)" opacity="0.6"/>
    <ellipse cx="455" cy="410" rx="7" ry="10" fill="rgba(253,230,138,0.4)" opacity="0.5"/>
  </g>

  <!-- Labels -->
  <line x1="620" y1="130" x2="475" y2="150" stroke="#00AFC8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="625" y="133" fill="#a5f3fc" font-size="15" font-weight="bold">Femur (Posterior)</text>

  <line x1="150" y1="270" x2="370" y2="290" stroke="#00AFC8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="145" y="273" text-anchor="end" fill="#a5f3fc" font-size="15" font-weight="bold">Popliteal Space (Behind Knee)</text>

  <line x1="640" y1="400" x2="498" y2="395" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2" opacity="0.8"/>
  <text x="645" y="403" fill="#fdba74" font-size="15" font-weight="bold">Baker's Cyst (Fluid Swelling)</text>

  <line x1="150" y1="500" x2="350" y2="480" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="145" y="503" text-anchor="end" fill="#cbd5e1" font-size="15" font-weight="bold">Tibia (Shin Bone)</text>

  <!-- Watermark banner -->
  <rect x="0" y="555" width="800" height="45" fill="#1e293b" rx="0"/>
  <rect x="0" y="555" width="6" height="45" fill="#f97316"/>
  <text x="20" y="575" font-size="14" font-weight="bold" fill="#fdba74">EDUCATIONAL ILLUSTRATION — AWAITING CLINICAL REVIEW</text>
  <text x="20" y="592" font-size="12" fill="#cbd5e1">Not a clinical reference. Not for diagnosis. All rights reserved — Lincolnshire Knee Clinic.</text>
</svg>
